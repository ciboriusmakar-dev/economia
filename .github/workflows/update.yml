name: Обновление данных и публикация сайта
on:
  schedule:
    - cron: '17 4 * * *'      # каждый день в 04:17 UTC
  workflow_dispatch: {}        # и вручную кнопкой «Run workflow»
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Кэш прежних файлов (на случай сбоя загрузки)
        uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Загрузка данных
        run: python update_data.py
      - name: Тесты
        run: python -m pytest -q
      - name: Сборка сайта
        run: python build_site.py
      - name: Сохранить манифест версий данных
        run: |
          git config user.name "economia-bot"
          git config user.email "economia-bot@users.noreply.github.com"
          git add data/manifest.json
          git diff --cached --quiet || (git commit -m "Обновлён манифест данных" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
